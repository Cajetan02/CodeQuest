# Android
android.useAndroidX=true
android.targetSdk=35
android.compileSdk=35
android.minSdk=26

# Versions (Note: These might be overridden by libs.versions.toml)
kotlin.version=2.0.21
agp.version=8.5.2
compose.version=1.7.0
